# ============================================
# The Joker - Docker Compose
# ============================================

services:
  joker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thejoker
    stdin_open: true     # -i (interactive)
    tty: true            # -t (pseudo-TTY)
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      # Persist generated projects and reports
      - ./projects:/app/projects
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./.joker_memory:/app/.joker_memory
    ports:
      # AirLLM sidecar port
      - "8899:8899"
    # Required for Puppeteer in Docker
    security_opt:
      - seccomp=unconfined
    # Ensure the container can reach host LM Studio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
